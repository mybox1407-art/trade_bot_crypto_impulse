services:
  trade_bot:
    build: .
    container_name: trade_bot_crypto_impulse
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./logs:/app/logs
      - ./signal_log.csv:/app/signal_log.csv
      - ./position_open_log.csv:/app/position_open_log.csv
      - ./position_check_log.csv:/app/position_check_log.csv
      - ./trade_log.csv:/app/trade_log.csv
      - ./error_log.csv:/app/error_log.csv
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
