services:
  trade_bot:
    build: .
    container_name: trade_bot_crypto_impulse
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./signal_log.csv:/app/signal_log.csv
      - ./trade_log.csv:/app/trade_log.csv
      - ./position_check_log.csv:/app/position_check_log.csv
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
